<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main">
        <div id="head">
            <h1>Expense Tracker</h1>
        </div>

        <label for="initialBalance">Starting Balance: </label>
        <input type="number" name="initialBalance" id="initialBalance">

        <form action="/" class="content">
            <ul>
                <li>
                    <label for="title">Title :</label>
                    <input type="text" name="title" id="title">
                </li>
                <li> 
                    <label for="amount">Amount :</label>
                    <input type="number" name="amount" id="amount"></li>
                <li>
                    <label for="category">Category :</label>
                    <select name="category" id="category">
                        <option value="food">Food</option>
                        <option value="rent">Rent</option>
                        <option value="gym">Gym</option>
                        <option value="clothes">Clothes</option>
                        <option value="grocery">Grocery</option>
                        <option value="travel">Travel</option>
                        <option value="shopping">Shopping</option>
                        <option value="others">Others</option>
                    </select>
                </li>
                <li>
                    <label for="date">Date :</label>
                    <input type="date" name="date" id="date">
                </li>
            </ul>

            <button type="submit" id="button">Add Expense</button>
        </form>

        <div id="expenselist">
            <ul id="expenseItems">
            </ul>
        </div>

        <div id="end">
            <div class="balance-card">
                <span>Total Expenses</span>
                <strong id="totalExpenses">₹0</strong>
            </div>

            <div class="balance-card">
                <span>Left Balance</span>
                <strong id="leftBalance">₹0</strong>
            </div>
        </div>

    </div>
    <script src="app.js"></script>
</body>
</html>
